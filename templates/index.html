  {% extends 'base.html' %}
  {% block content %}
    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h3>{{ name }}</h3>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/fernando.jpg" alt="Photo of {{ name }}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Last Login Session</dt>
                            <dd>{{ last_login }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/fhazl" class="social-link">GitHub</a>
                        <a href="https://id.linkedin.com/in/fernando-hazel-72b637321" class="social-link">LinkedIn</a>
                        <a href="fernandohazel124@gmail.com" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="skill" id="skill">
            <div class="skill-header">
                    <h2>Skills</h2>
                <div class="container skill-grid">
                    <div class="skill-card">
                        <img class="skill-icon" src="/static/img/python.png" alt="Icon of Python">
                        <h3>Python</h3>
                    </div>
                    <div class="skill-card">
                        <img class="skill-icon" src="/static/img/java.png" alt="Icon of Java">
                        <h3>Java</h3>
                    </div>
                    <div class="skill-card">
                        <img class="skill-icon" src="/static/img/figma.png" alt="Icon of Figma">
                        <h3>Figma</h3>
                    </div>
                </div>
            </div>
        </section>
    </main>
  {% endblock content %}
