<div class="star-wrapper">
    <form action="{% url 'main:toggle_star_education' education.id %}" method="POST" class="star-form">
        {% csrf_token %}
        <button type="submit" class="button-star {% if user in education.starred_by.all %}is-starred{% endif %}">
            ★ {% if user in education.starred_by.all %}Unstar{% else %}Star{% endif %}
            <span class="star-count">{{ education.starred_by.count }}</span>
        </button>
    </form>
</div>
