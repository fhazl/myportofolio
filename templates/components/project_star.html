<div class="star-wrapper">
    <form action="{% url 'main:toggle_star_project' project.id %}" method="POST" class="star-form">
        {% csrf_token %}
        <button type="submit" class="button-star {% if user in project.starred_by.all %}is-starred{% endif %}">
            ★ {% if user in project.starred_by.all %}Unstar{% else %}Star{% endif %}
            <span class="star-count">{{ project.starred_by.count }}</span>
        </button>
    </form>
</div>
